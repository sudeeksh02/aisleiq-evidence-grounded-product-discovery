services:
  api:
    build: .
    command: uvicorn aisleiq.api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_URL: sqlite:////app/data/aisleiq.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 180s
  web:
    image: node:22-alpine
    working_dir: /web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes: ["./frontend:/web"]
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
